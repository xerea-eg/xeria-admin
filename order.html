<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1030">
<title>اطلب نظامك من XERIA</title>
<style>
:root{--bg:#0a1030;--card:#131a45;--text:#fff;--mut:#9aa4d6;--a1:#7c3aed;--a2:#2f6bff;--err:#ff5c7a;--line:#ffffff2e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
.brand{letter-spacing:3px;font-weight:800;font-size:20px;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;color:transparent}
h1{font-size:22px;margin:4px 0 4px}
p.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
h2.st{font-size:15px;margin:18px 0 8px;color:var(--mut);font-weight:600}
.toggle{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:12px;margin-bottom:10px}
.toggle button{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:9px;font-size:15px;font-family:inherit}
.toggle button.on{background:linear-gradient(90deg,var(--a1),var(--a2));color:#fff}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plan{background:var(--card);border:2px solid transparent;border-radius:14px;padding:14px 8px 10px;text-align:center;position:relative;cursor:pointer}
.plan.sel{border-color:var(--a2)}
.plan b{font-size:16px}.plan .pr{font-size:17px;margin-top:6px;font-weight:700}.plan small{color:var(--mut);font-size:12px}
.plan:last-child:nth-child(odd){grid-column:1/-1}
.badge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--a1);color:#fff;font-size:11px;padding:2px 10px;border-radius:20px;white-space:nowrap}
form{background:var(--card);border-radius:18px;padding:16px;display:grid;gap:14px}
label{font-size:14px;color:var(--mut);display:grid;gap:6px}
input,select,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:16px;font-family:inherit}
select option{color:#000}
textarea{resize:vertical;min-height:110px}
.btn{border:0;border-radius:12px;padding:12px 16px;color:#fff;background:linear-gradient(90deg,var(--a1),var(--a2));font-size:15px;font-family:inherit;cursor:pointer}
.btn.g{background:#ffffff1f}
.mic{width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.mic.on{background:#c0264a;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.65}}
.hint{font-size:12px;color:var(--mut);margin:0}
.file{border:1px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;font-size:14px;color:var(--mut)}
.file input{padding:8px;font-size:14px}
#prev{max-width:90px;max-height:90px;border-radius:10px}
.bar{position:fixed;inset-inline:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.bar .in{max-width:560px;margin:0 auto}
.big{padding:16px;font-size:18px;width:100%}.big:disabled{opacity:.5}
.err{color:var(--err);font-size:14px;min-height:0;margin-bottom:6px}.err:empty{display:none}
.hide{display:none!important}
.ok{text-align:center;background:var(--card);border-radius:18px;padding:36px 18px;margin-top:20px}.ok h2{margin:0 0 10px;font-size:20px}.num{font-size:28px;font-weight:800;color:var(--a2);margin:12px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">XERIA</div>
  <h1>اطلب نظامك</h1>
  <p class="sub">املأ بياناتك وفريقنا هيتواصل معاك</p>

  <div id="formArea">
    <h2 class="st">1) اختار الباقة</h2>
    <div class="toggle"><button id="mBtn" class="on" type="button">شهريًا</button><button id="yBtn" type="button">سنويًا</button></div>
    <div class="plans" id="plans"></div>

    <h2 class="st">2) بياناتك</h2>
    <form id="f" novalidate>
      <label>الاسم *<input id="fullName" maxlength="100" autocomplete="name"></label>
      <label>رقم الهاتف (واتساب) *<input id="phone" type="tel" inputmode="tel" maxlength="15" autocomplete="tel"></label>
      <label>اسم النشاط *<input id="businessName" maxlength="100"></label>
      <label>نوع النشاط *<select id="businessType"><option value="">اختر...</option></select></label>
      <label id="otherWrap" class="hide">اكتب نوع نشاطك *<input id="otherType" maxlength="60"></label>

      <label>احتياجك (اختياري)
        <textarea id="description" maxlength="1500" placeholder="اكتب هنا أو اضغط الميكروفون وتكلم"></textarea>
      </label>
      <button type="button" class="btn g mic" id="mic">🎙️ اتكلم بدل ما تكتب</button>
      <p class="hint" id="micHint"></p>

      <div class="file">
        <span>لوجو النشاط (اختياري)</span>
        <input id="logo" type="file" accept="image/*">
        <img id="prev" class="hide" alt="">
      </div>

      <input id="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;height:0;opacity:0">
    </form>
  </div>

  <div class="ok hide" id="ok">
    <h2>تم استلام طلبك ✅</h2>
    <div>رقم طلبك</div><div class="num" id="reqNum"></div>
    <div>فريق XERIA هيتواصل معاك قريبًا.</div>
  </div>
</div>

<div class="bar" id="bar"><div class="in">
  <div class="err" id="err"></div>
  <button class="btn big" id="submit" type="button">إرسال الطلب</button>
</div></div>

<script type="module">
import { db, COL } from "./src/firebase.js";
import { doc, collection, getDoc, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const $ = id => document.getElementById(id);

// ---------- الباقات ----------
let P = { startMonthly:399,startYearly:3990,proMonthly:599,proYearly:5990,businessMonthly:899,businessYearly:8990 };
try { const s = await getDoc(doc(db, COL.settings, "plans")); if (s.exists()) P = { ...P, ...s.data() }; } catch {}
let cycle = "MONTHLY", plan = "PRO";
const fmt = n => Number(n).toLocaleString("ar-EG");
function renderPlans() {
  const m = cycle === "MONTHLY", sfx = m ? "Monthly" : "Yearly", per = m ? "شهريًا" : "سنويًا";
  const list = [
    ["TRIAL","تجربة مجانية","مجانًا",""],
    ["START","Start",fmt(P["start"+sfx])+" جنيه",per],
    ["PRO","Pro",fmt(P["pro"+sfx])+" جنيه",per,"الأكثر اختيارًا"],
    ["BUSINESS","Business",fmt(P["business"+sfx])+" جنيه",per],
    ["CUSTOM","Custom","حسب المطلوب","نظام مخصص"]
  ];
  $("plans").innerHTML = list.map(([k,n,pr,sm,b]) =>
    `<div class="plan ${plan===k?"sel":""}" data-k="${k}">${b?`<span class="badge">${b}</span>`:""}<b>${n}</b><div class="pr">${pr}</div><small>${sm}</small></div>`).join("");
  document.querySelectorAll(".plan").forEach(e => e.onclick = () => { plan = e.dataset.k; renderPlans(); });
}
$("mBtn").onclick = () => { cycle="MONTHLY"; $("mBtn").className="on"; $("yBtn").className=""; renderPlans(); };
$("yBtn").onclick = () => { cycle="YEARLY"; $("yBtn").className="on"; $("mBtn").className=""; renderPlans(); };
renderPlans();

// ---------- أنواع النشاط ----------
const TYPES = ["محل تجاري","بيع بالتقسيط","عيادة","مركز طبي","مكتب محاماة","مخزن","شركة","مكتب إداري","مطعم / كافيه","نشاط آخر"];
TYPES.forEach(t => $("businessType").add(new Option(t, t)));
$("businessType").onchange = e => $("otherWrap").classList.toggle("hide", e.target.value !== "نشاط آخر");

// ---------- الإملاء الصوتي: الكلام يتحول لنص داخل خانة الوصف (لا يُرسل صوت) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
const setMic = on => { listening = on; $("mic").classList.toggle("on", on); $("mic").textContent = on ? "⏹ إيقاف (بيسمعك...)" : "🎙️ اتكلم بدل ما تكتب"; };
if (!SR) { $("mic").classList.add("hide"); $("micHint").textContent = "💡 تقدر تستخدم ميكروفون كيبورد الموبايل للكتابة بالصوت."; }
else $("mic").onclick = () => {
  if (listening) { rec.stop(); return; }
  $("err").textContent = "";
  let base = $("description").value.trim(); if (base) base += " ";
  rec = new SR(); rec.lang = "ar-EG"; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => { $("description").value = (base + Array.from(e.results).map(r => r[0].transcript).join(" ")).slice(0, 1500); };
  rec.onerror = e => { $("err").textContent = e.error === "not-allowed" || e.error === "service-not-allowed" ? "اسمح للمتصفح باستخدام الميكروفون." : e.error === "no-speech" ? "مسمعتش صوت، جرّب تاني." : e.error === "network" ? "التحويل الصوتي محتاج إنترنت." : ""; };
  rec.onend = () => setMic(false);
  try { rec.start(); setMic(true); } catch { setMic(false); }
};

// ---------- الشعار (يُصغَّر ويُحفظ داخل Firestore) ----------
async function shrink(file) { try { const img = await createImageBitmap(file), k = Math.min(1, 400 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
  cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
  return await new Promise(res => cv.toBlob(b => res(b), "image/jpeg", 0.7)); } catch { return null; } }
const toDataUrl = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
let logoFile = null;
$("logo").onchange = e => {
  const f = e.target.files[0]; $("err").textContent = "";
  if (!f) { logoFile = null; $("prev").classList.add("hide"); return; }
  if (!f.type.startsWith("image/") || f.size > 10*1024*1024) { $("err").textContent = "اختار صورة أقل من 10MB."; e.target.value = ""; return; }
  logoFile = f; $("prev").src = URL.createObjectURL(f); $("prev").classList.remove("hide");
};

// ---------- الإرسال ----------
$("submit").onclick = async () => {
  const err = $("err"); err.textContent = "";
  if ($("website").value) { $("formArea").classList.add("hide"); $("bar").classList.add("hide"); $("reqNum").textContent = "XR-000000"; $("ok").classList.remove("hide"); return; } // فخ للبوتات
  if (listening && rec) rec.stop();
  const v = id => $(id).value.trim();
  const type = v("businessType") === "نشاط آخر" ? v("otherType") : v("businessType");
  if (!v("fullName") || !v("phone") || !v("businessName") || !type) { err.textContent = "من فضلك أكمل الحقول المطلوبة (*)."; return; }
  if (!/^[0-9+\s-]{8,15}$/.test(v("phone"))) { err.textContent = "رقم الهاتف غير صحيح."; return; }
  $("submit").disabled = true; $("submit").textContent = "جارٍ الإرسال...";
  try {
    let logoUrl = "";
    if (logoFile) { const b = await shrink(logoFile); if (b) logoUrl = await toDataUrl(b); if (logoUrl.length > 140000) logoUrl = ""; }
    const custRef = doc(collection(db, COL.customers)), reqRef = doc(collection(db, COL.requests));
    const cntRef = doc(db, COL.settings, "counters"), phoneKey = v("phone").replace(/\D/g, "").slice(-10);
    const number = await runTransaction(db, async tx => {
      const c = await tx.get(cntRef);
      const seq = c.exists() ? c.data().requestSeq + 1 : 1;
      tx.set(cntRef, { requestSeq: seq }, { merge: true });
      tx.set(doc(db, "rateLimits", phoneKey), { lastAt: serverTimestamp() }); // طلب واحد لكل رقم كل 10 دقائق
      const num = "XR-" + String(seq).padStart(6, "0");
      tx.set(custRef, { fullName: v("fullName"), phone: v("phone"), whatsapp: "", businessName: v("businessName"),
        businessType: type, governorate: "", city: "", branchesCount: 1, expectedUsers: 1,
        logoUrl, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
      tx.set(reqRef, { requestId: reqRef.id, requestNumber: num, customerId: custRef.id, phoneKey, selectedPlan: plan,
        billingCycle: plan === "TRIAL" ? "TRIAL" : cycle, hasExistingSystem: false,
        description: v("description"), audioUrl: "", attachments: [], status: "NEW",
        createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
      return num;
    });
    $("reqNum").textContent = number; $("formArea").classList.add("hide"); $("bar").classList.add("hide"); $("ok").classList.remove("hide"); scrollTo(0,0);
  } catch (x) {
    console.error(x); err.textContent = x.code === "permission-denied" ? "تعذّر الإرسال: ممكن يكون فيه طلب من نفس الرقم خلال آخر 10 دقائق. فريقنا هيتواصل معاك قريبًا." : "حصل خطأ أثناء الإرسال، حاول تاني.";
    $("submit").disabled = false; $("submit").textContent = "إرسال الطلب";
  }
};
</script>
</body>
</html>
