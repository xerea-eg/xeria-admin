<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اطلب نظامك من XERIA</title>
<style>
:root{--bg:#0a1030;--card:#131a45;--text:#fff;--mut:#9aa4d6;--a1:#7c3aed;--a2:#2f6bff;--err:#ff5c7a;--line:#ffffff22}
:root[data-theme=light]{--bg:#f3f5fc;--card:#fff;--text:#0a1030;--mut:#5b6494;--line:#0a103022}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:8px 0}.brand{letter-spacing:3px;font-weight:800;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;color:transparent}
p.sub{color:var(--mut);margin:0 0 18px}
.toggle{display:flex;gap:6px;background:var(--card);padding:4px;border-radius:12px;width:fit-content;margin-bottom:14px}
.toggle button{border:0;background:none;color:var(--mut);padding:8px 16px;border-radius:9px;cursor:pointer;font-size:14px}
.toggle button.on{background:linear-gradient(90deg,var(--a1),var(--a2));color:#fff}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.plan{background:var(--card);border:2px solid transparent;border-radius:16px;padding:16px 12px;cursor:pointer;position:relative;text-align:center}
.plan.sel{border-color:var(--a2)}.plan b{font-size:17px}.plan .pr{font-size:20px;margin-top:8px;font-weight:700}.plan small{color:var(--mut)}
.badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--a1);color:#fff;font-size:11px;padding:2px 10px;border-radius:20px;white-space:nowrap}
form{background:var(--card);border-radius:18px;padding:18px;margin-top:20px;display:grid;gap:12px}
label{font-size:14px;color:var(--mut);display:grid;gap:5px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:16px;font-family:inherit}
select option{color:#000}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.row{grid-template-columns:1fr}}
.btn{border:0;border-radius:10px;padding:11px 16px;color:#fff;background:linear-gradient(90deg,var(--a1),var(--a2));font-size:15px;cursor:pointer;font-family:inherit}
.btn.g{background:#ffffff18}.btn.r{background:#c0264a}
.big{padding:16px;font-size:18px;width:100%}.big:disabled{opacity:.5}
.box{border:1px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#prev{max-width:120px;max-height:120px;border-radius:10px}
.rec{color:var(--err)}.err{color:var(--err);font-size:14px;min-height:18px}.hide{display:none!important}
.ok{text-align:center;background:var(--card);border-radius:18px;padding:40px 20px;margin-top:20px}.ok h2{margin:0 0 10px}.num{font-size:28px;font-weight:800;color:var(--a2);margin:14px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">XERIA</div>
  <h1>اطلب نظامك من XERIA</h1>
  <p class="sub">اختار الباقة المناسبة وسيقوم فريقنا بالتواصل معك</p>

  <div class="toggle"><button id="mBtn" class="on">شهريًا</button><button id="yBtn">سنويًا</button></div>
  <div class="plans" id="plans"></div>

  <form id="f" novalidate>
    <div class="row">
      <label>الاسم بالكامل *<input id="fullName" maxlength="100"></label>
      <label>رقم الهاتف *<input id="phone" type="tel" inputmode="tel" maxlength="15"></label>
    </div>
    <div class="row">
      <label>رقم WhatsApp<input id="whatsapp" type="tel" inputmode="tel" maxlength="15"></label>
      <label>اسم النشاط *<input id="businessName" maxlength="100"></label>
    </div>
    <label>نوع النشاط *
      <select id="businessType"><option value="">اختر...</option></select>
    </label>
    <label id="otherWrap" class="hide">اكتب نوع نشاطك *<input id="otherType" maxlength="60"></label>
    <div class="row">
      <label>المحافظة<input id="governorate" maxlength="40"></label>
      <label>المدينة / المركز<input id="city" maxlength="40"></label>
    </div>
    <div class="row">
      <label>عدد الفروع<input id="branchesCount" type="number" min="1" value="1"></label>
      <label>عدد المستخدمين المتوقع<input id="expectedUsers" type="number" min="1" value="1"></label>
    </div>
    <label>هل لديك نظام حالي؟
      <select id="hasSystem"><option value="no">لا</option><option value="yes">نعم</option></select>
    </label>
    <label>وصف احتياجاتك<textarea id="description" rows="3" maxlength="1500"></textarea></label>

    <div class="box">
      <b>لوجو النشاط أو صورة المحل</b>
      <input id="logo" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
      <img id="prev" class="hide" alt="">
    </div>

    <div class="box">
      <b>🎙️ اشرح لنا شغلك بصوتك</b>
      <div class="acts">
        <button type="button" class="btn" id="recStart">بدء التسجيل</button>
        <button type="button" class="btn g hide" id="recStop">إيقاف</button>
        <span id="timer" class="rec"></span>
      </div>
      <audio id="player" controls class="hide"></audio>
      <div class="acts hide" id="recActs">
        <button type="button" class="btn g" id="recRe">إعادة التسجيل</button>
        <button type="button" class="btn r" id="recDel">حذف التسجيل</button>
      </div>
    </div>

    <input id="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;height:0;opacity:0">
    <div class="err" id="err"></div>
    <button class="btn big" id="submit" type="submit">إرسال طلبك</button>
  </form>

  <div class="ok hide" id="ok">
    <h2>تم استلام طلبك بنجاح ✅</h2>
    <div>رقم طلبك</div><div class="num" id="reqNum"></div>
    <div>سيتواصل معك فريق XERIA لتأكيد التفاصيل.</div>
  </div>
</div>

<script type="module">
import { db, storage, COL } from "./src/firebase.js";
import { doc, collection, getDoc, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
const $ = id => document.getElementById(id);

// ---------- الباقات (من settings/plans، مع قيم افتراضية احتياطية) ----------
let P = { startMonthly:399,startYearly:3990,proMonthly:599,proYearly:5990,businessMonthly:899,businessYearly:8990 };
try { const s = await getDoc(doc(db, COL.settings, "plans")); if (s.exists()) P = { ...P, ...s.data() }; } catch {}
let cycle = "MONTHLY", plan = "PRO";
const fmt = n => Number(n).toLocaleString("ar-EG");
function renderPlans() {
  const m = cycle === "MONTHLY", sfx = m ? "Monthly" : "Yearly", per = m ? "شهريًا" : "سنويًا";
  const list = [
    ["TRIAL","تجربة مجانية","مجانًا",""],
    ["START","Start",fmt(P["start"+sfx])+" جنيه",per],
    ["PRO","Pro",fmt(P["pro"+sfx])+" جنيه",per,"الأكثر اختيارًا"],
    ["BUSINESS","Business",fmt(P["business"+sfx])+" جنيه",per],
    ["CUSTOM","Custom","حسب المطلوب","نظام مصمم حسب احتياجات العميل"]
  ];
  $("plans").innerHTML = list.map(([k,n,pr,sm,b]) =>
    `<div class="plan ${plan===k?"sel":""}" data-k="${k}">${b?`<span class="badge">${b}</span>`:""}<b>${n}</b><div class="pr">${pr}</div><small>${sm}</small></div>`).join("");
  document.querySelectorAll(".plan").forEach(e => e.onclick = () => { plan = e.dataset.k; renderPlans(); });
}
$("mBtn").onclick = () => { cycle="MONTHLY"; $("mBtn").className="on"; $("yBtn").className=""; renderPlans(); };
$("yBtn").onclick = () => { cycle="YEARLY"; $("yBtn").className="on"; $("mBtn").className=""; renderPlans(); };
renderPlans();

// ---------- أنواع النشاط ----------
const TYPES = ["محل تجاري","بيع بالتقسيط","عيادة","مركز طبي","مكتب محاماة","مخزن","شركة","مكتب إداري","مطعم / كافيه","نشاط آخر"];
TYPES.forEach(t => $("businessType").add(new Option(t, t)));
$("businessType").onchange = e => $("otherWrap").classList.toggle("hide", e.target.value !== "نشاط آخر");

// ---------- الصورة ----------
// تصغير الصورة قبل الرفع (حد 1280px، JPEG) لتوفير مساحة Storage والباندويث
async function shrink(file) { if (file.type === "image/gif") return file; try { const img = await createImageBitmap(file), k = Math.min(1, 1280 / Math.max(img.width, img.height)), cv = document.createElement("canvas");
  cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
  return await new Promise(res => cv.toBlob(b => res(b || file), "image/jpeg", 0.8)); } catch { return file; } }
const IMG_OK = ["image/jpeg","image/png","image/webp","image/gif"], IMG_MAX = 5*1024*1024;
let logoFile = null;
$("logo").onchange = e => {
  const f = e.target.files[0]; $("err").textContent = "";
  if (!f) { logoFile = null; $("prev").classList.add("hide"); return; }
  if (!IMG_OK.includes(f.type) || f.size > IMG_MAX) { $("err").textContent = "الصورة يجب أن تكون JPG/PNG/WEBP/GIF وأقل من 5MB."; e.target.value = ""; return; }
  logoFile = f; $("prev").src = URL.createObjectURL(f); $("prev").classList.remove("hide");
};

// ---------- التسجيل الصوتي (يُطلب الميكروفون عند البدء فقط) ----------
let mr, chunks = [], audioBlob = null, tInt, sec = 0;
const AUDIO_MAX = 10*1024*1024;
const tick = () => $("timer").textContent = "● " + String(Math.floor(sec/60)).padStart(2,"0") + ":" + String(sec%60).padStart(2,"0");
async function startRec() {
  $("err").textContent = "";
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mr = new MediaRecorder(stream, { audioBitsPerSecond: 32000 }); chunks = []; sec = 0; tick();
    mr.ondataavailable = e => e.data.size && chunks.push(e.data);
    mr.onstop = () => {
      stream.getTracks().forEach(t => t.stop()); clearInterval(tInt);
      audioBlob = new Blob(chunks, { type: mr.mimeType || "audio/webm" });
      if (audioBlob.size > AUDIO_MAX) { $("err").textContent = "التسجيل كبير جدًا، اجعله أقصر."; audioBlob = null; return; }
      $("player").src = URL.createObjectURL(audioBlob); $("player").classList.remove("hide");
      $("recActs").classList.remove("hide"); $("recStart").classList.add("hide"); $("recStop").classList.add("hide");
    };
    mr.start(); tInt = setInterval(() => { sec++; tick(); if (sec >= 180) mr.stop(); }, 1000);
    $("recStart").classList.add("hide"); $("recStop").classList.remove("hide");
  } catch { $("err").textContent = "تعذّر الوصول إلى الميكروفون. اسمح به من إعدادات المتصفح."; }
}
function delRec() { audioBlob = null; $("player").removeAttribute("src"); $("player").classList.add("hide"); $("recActs").classList.add("hide"); $("recStart").classList.remove("hide"); $("timer").textContent = ""; }
$("recStart").onclick = startRec;
$("recStop").onclick = () => mr && mr.state !== "inactive" && mr.stop();
$("recDel").onclick = delRec;
$("recRe").onclick = () => { delRec(); startRec(); };

// ---------- الإرسال ----------
async function upload(blob, folderExt) {
  const r = ref(storage, `public-uploads/${crypto.randomUUID()}.${folderExt}`);
  await uploadBytes(r, blob, { contentType: blob.type.split(";")[0] });
  return getDownloadURL(r);
}
const extOf = t => ({ "image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif","audio/webm":"webm","audio/mp4":"m4a","audio/ogg":"ogg","audio/mpeg":"mp3" }[t.split(";")[0]] || "bin");

$("f").onsubmit = async e => {
  e.preventDefault(); const err = $("err"); err.textContent = "";
  if ($("website").value) { $("f").classList.add("hide"); $("reqNum").textContent = "XR-000000"; $("ok").classList.remove("hide"); return; } // فخ للبوتات
  const v = id => $(id).value.trim();
  const type = v("businessType") === "نشاط آخر" ? v("otherType") : v("businessType");
  if (!v("fullName") || !v("phone") || !v("businessName") || !type) { err.textContent = "من فضلك أكمل الحقول المطلوبة (*)."; return; }
  if (!/^[0-9+\s-]{8,15}$/.test(v("phone"))) { err.textContent = "رقم الهاتف غير صحيح."; return; }
  $("submit").disabled = true; $("submit").textContent = "جارٍ الإرسال...";
  try {
    const lf = logoFile ? await shrink(logoFile) : null, logoUrl = lf ? await upload(lf, extOf(lf.type)) : "";
    const audioUrl = audioBlob ? await upload(audioBlob, extOf(audioBlob.type)) : "";
    const custRef = doc(collection(db, COL.customers)), reqRef = doc(collection(db, COL.requests));
    const cntRef = doc(db, COL.settings, "counters"), phoneKey = v("phone").replace(/\D/g, "").slice(-10);
    const number = await runTransaction(db, async tx => {
      const c = await tx.get(cntRef);
      const seq = c.exists() ? c.data().requestSeq + 1 : 1;
      tx.set(cntRef, { requestSeq: seq }, { merge: true });
      tx.set(doc(db, "rateLimits", phoneKey), { lastAt: serverTimestamp() }); // طلب واحد لكل رقم كل 10 دقائق
      const num = "XR-" + String(seq).padStart(6, "0");
      tx.set(custRef, { fullName: v("fullName"), phone: v("phone"), whatsapp: v("whatsapp"), businessName: v("businessName"),
        businessType: type, governorate: v("governorate"), city: v("city"),
        branchesCount: Number($("branchesCount").value) || 1, expectedUsers: Number($("expectedUsers").value) || 1,
        logoUrl, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
      tx.set(reqRef, { requestId: reqRef.id, requestNumber: num, customerId: custRef.id, phoneKey, selectedPlan: plan,
        billingCycle: plan === "TRIAL" ? "TRIAL" : cycle, hasExistingSystem: $("hasSystem").value === "yes",
        description: v("description"), audioUrl, attachments: logoUrl ? [logoUrl] : [], status: "NEW",
        createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
      return num;
    });
    $("reqNum").textContent = number; $("f").classList.add("hide"); $("ok").classList.remove("hide"); scrollTo(0,0);
  } catch (x) {
    console.error(x); err.textContent = x.code === "permission-denied" ? "تعذّر الإرسال: قد يكون هناك طلب من نفس الرقم خلال آخر 10 دقائق. سيتواصل معك فريقنا قريبًا." : "حدث خطأ أثناء الإرسال، حاول مرة أخرى.";
    $("submit").disabled = false; $("submit").textContent = "إرسال طلبك";
  }
};
</script>
</body>
</html>
